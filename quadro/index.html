<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Source Sans Pro", -apple-system, Segoe UI, sans-serif; }

  .quadro { display: flex; gap: 12px; align-items: stretch; overflow-x: auto; padding: 2px 2px 10px 2px; }

  .coluna { flex: 1; min-width: 235px; border-radius: 12px; padding: 8px;
            display: flex; flex-direction: column; }
  .coluna-topo { display: flex; align-items: center; gap: 8px; font-size: 11px;
                 font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
                 padding: 4px 4px 9px 4px; }
  .bolinha { width: 9px; height: 9px; border-radius: 999px; flex: none; }
  .contador { margin-left: auto; padding: 1px 9px; border-radius: 7px; font-weight: 700;
              font-size: 11px; }
  .mais { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center;
          justify-content: center; font-size: 17px; font-weight: 700; line-height: 1;
          cursor: pointer; margin-left: 8px; transition: all .12s ease; }
  .mais:hover { transform: scale(1.08); }

  .corpo { display: flex; flex-direction: column; gap: 6px; min-height: 520px;
           max-height: 80vh; overflow-y: auto; padding: 3px; border-radius: 8px;
           transition: background .12s ease; }
  .corpo.alvo { outline: 2px dashed var(--marca); outline-offset: -4px; }

  .cartao { border-radius: 7px; padding: 7px 9px; cursor: grab;
            border-left-width: 3px; border-left-style: solid;
            transition: transform .1s ease, border-color .12s ease, box-shadow .12s ease;
            user-select: none; }
  .cartao:hover { box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .cartao.arrastando { opacity: .45; transform: scale(.98); }

  .selo { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 9px;
          font-weight: 800; letter-spacing: .5px; text-transform: uppercase;
          margin-bottom: 4px; }
  .titulo { font-size: 13px; font-weight: 650; line-height: 1.3; }
  .linha-meta { display: flex; justify-content: space-between; gap: 8px;
                font-size: 10.5px; margin-top: 5px; }
  .clipe { font-weight: 700; opacity: .85; }

  .vazia { text-align: center; font-size: 12px; padding: 16px 0; border: 1px dashed;
           border-radius: 9px; }
  .dica { font-size: 11.5px; padding: 4px 2px 0 2px; }
</style>
</head>
<body>
<div id="raiz"></div>

<script>
// ---------------------------------------------------------------- protocolo
function enviar(valor) {
  window.parent.postMessage({
    isStreamlitMessage: true, type: "streamlit:setComponentValue",
    value: valor, dataType: "json"
  }, "*");
}
function altura() {
  const h = document.documentElement.scrollHeight;
  window.parent.postMessage({
    isStreamlitMessage: true, type: "streamlit:setFrameHeight", height: h
  }, "*");
}

let T = {};              // paleta
let arrastado = null;    // id do cartão em movimento

// ---------------------------------------------------------------- desenho
function desenhar(colunas, tema) {
  T = tema;
  document.body.style.setProperty("--marca", T.marca);
  const raiz = document.getElementById("raiz");
  raiz.innerHTML = "";

  const quadro = document.createElement("div");
  quadro.className = "quadro";

  colunas.forEach(col => {
    const c = document.createElement("div");
    c.className = "coluna";
    c.style.background = T.painel;
    c.style.border = "1px solid " + T.linha;

    const topo = document.createElement("div");
    topo.className = "coluna-topo";
    topo.style.color = T.texto;
    topo.innerHTML =
      `<span class="bolinha" style="background:${col.cor}"></span>${col.nome}` +
      `<span class="contador" style="background:${T.item};border:1px solid ${T.linha};color:${T.texto}">${col.total !== undefined ? col.total : col.cards.length}</span>`;

    c.appendChild(topo);

    const corpo = document.createElement("div");
    corpo.className = "corpo";
    corpo.dataset.coluna = col.nome;

    if (col.cards.length === 0) {
      const v = document.createElement("div");
      v.className = "vazia";
      v.style.color = T.muted;
      v.style.borderColor = T.linha;
      v.textContent = "Arraste um cartão para cá";
      corpo.appendChild(v);
    }

    col.cards.forEach(card => corpo.appendChild(montarCartao(card)));

    // Cartões além do teto não são desenhados: DOM demais trava a rolagem.
    if (col.ocultos > 0) {
      const aviso = document.createElement("div");
      aviso.className = "vazia";
      aviso.style.color = T.muted;
      aviso.style.borderColor = T.linha;
      aviso.textContent = `+${col.ocultos} não exibida(s) — use os filtros ou a Lista`;
      corpo.appendChild(aviso);
    }

    corpo.addEventListener("dragover", ev => {
      ev.preventDefault();
      corpo.classList.add("alvo");
    });
    corpo.addEventListener("dragleave", () => corpo.classList.remove("alvo"));
    corpo.addEventListener("drop", ev => {
      ev.preventDefault();
      corpo.classList.remove("alvo");
      if (arrastado === null) return;

      // Move na hora, antes de avisar o Python: o usuário não espera o servidor.
      // Exceção: soltar em Realizado abre o formulário de conclusão lá no
      // Python, e o cartão volta sozinho no redesenho seguinte.
      const el = document.querySelector(`.cartao[data-id="${arrastado}"]`);
      if (el && el.parentElement !== corpo && col.nome !== "Realizado") {
        const vazia = corpo.querySelector(".vazia");
        if (vazia) vazia.remove();
        const alvo = ev.target.closest(".cartao");
        if (alvo && alvo !== el) {
          const meio = alvo.getBoundingClientRect().top + alvo.offsetHeight / 2;
          corpo.insertBefore(el, ev.clientY < meio ? alvo : alvo.nextSibling);
        } else {
          corpo.appendChild(el);
        }
        atualizarContadores();
      }

      enviar({ acao: "mover", id: arrastado, para: col.nome, n: Date.now() });
      arrastado = null;
    });

    c.appendChild(corpo);
    quadro.appendChild(c);
  });

  raiz.appendChild(quadro);

  const dica = document.createElement("div");
  dica.className = "dica";
  dica.style.color = T.muted;
  dica.textContent = "Arraste para mudar de coluna · dois cliques no cartão para abrir · "
                   + "soltar em Realizado pede a descrição da conclusão";
  raiz.appendChild(dica);

  altura();
}

function atualizarContadores() {
  document.querySelectorAll(".coluna").forEach(col => {
    const n = col.querySelectorAll(".cartao").length;
    const c = col.querySelector(".contador");
    if (c) c.textContent = n;
  });
}

// Selo é conteúdo NOSSO (rótulo fixo + cor), então pode ser montado por string.
function selo(texto, cor) {
  const s = document.createElement("span");
  s.className = "selo";
  s.style.color = cor;
  s.style.background = cor + "22";
  s.style.border = "1px solid " + cor + "55";
  s.textContent = texto;
  return s;
}

function montarCartao(card) {
  const el = document.createElement("div");
  el.className = "cartao";
  el.draggable = true;
  el.dataset.id = card.id;
  el.style.background = T.item;
  el.style.border = "1px solid " + T.linha;
  el.style.borderLeftColor = card.acento;
  el.style.color = T.ink;

  // O status já é dado pela coluna — só marcamos as exceções.
  const selos = document.createElement("div");
  if (card.atrasada) selos.appendChild(selo("atrasada", card.acento));
  if (card.aguardando)
    selos.appendChild(selo("aguardando aprovação", card.cor_aguardando || T.marca));
  if (card.prorrogacao) selos.appendChild(selo("prorrogação", T.marca));
  if (selos.childNodes.length) el.appendChild(selos);

  /* Título e nomes vêm do usuário e NUNCA entram por innerHTML: um título como
     <img src=x onerror=...> rodaria no navegador de todo mundo que abrisse o
     quadro. Com textContent, o navegador trata como texto e ponto final. */
  const titulo = document.createElement("div");
  titulo.className = "titulo";
  titulo.textContent = card.titulo;
  el.appendChild(titulo);

  const meta = document.createElement("div");
  meta.className = "linha-meta";
  meta.style.color = T.texto;

  const pessoas = document.createElement("span");
  pessoas.textContent = card.pessoas;
  if (card.anexos) {
    const clipe = document.createElement("span");
    clipe.className = "clipe";
    clipe.textContent = ` 📎 ${card.anexos}`;
    pessoas.appendChild(clipe);
  }
  meta.appendChild(pessoas);

  const prazo = document.createElement("span");
  prazo.style.color = card.cor_prazo;
  prazo.style.fontWeight = "800";
  prazo.textContent = card.prazo;
  meta.appendChild(prazo);

  el.appendChild(meta);

  el.addEventListener("dragstart", () => {
    arrastado = card.id;
    el.classList.add("arrastando");
  });
  el.addEventListener("dragend", () => el.classList.remove("arrastando"));
  el.addEventListener("dblclick", () => enviar({ acao: "abrir", id: card.id, n: Date.now() }));

  return el;
}

// ---------------------------------------------------------------- ciclo
window.addEventListener("message", ev => {
  if (!ev.data || ev.data.type !== "streamlit:render") return;
  const args = ev.data.args || {};
  desenhar(args.colunas || [], args.tema || {});
});

window.parent.postMessage({
  isStreamlitMessage: true, type: "streamlit:componentReady", apiVersion: 1
}, "*");

window.addEventListener("resize", altura);
</script>
</body>
</html>
